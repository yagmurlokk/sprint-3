<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Ekle - Kampüs Etkinlikleri</title>
    <link rel="stylesheet" href="css/2416501035.css">
    <!-- Adım 9 Modülü -->
    <script type="module" src="js/event-form.js"></script>
</head>

<body>

    <header class="navbar">
    <h1>Kampüs Etkinlikleri</h1>
    <nav>
        <a href="index.html">Ana Sayfa</a>
        <a href="etkinlikler.html">Etkinlikler</a>
        <a href="etkinlik-ekle.html" class="active">Ekle</a>
    </nav>
</header>

    <main class="container" style="max-width: 600px;">
        <h2>Etkinlik Ekle</h2>

        <!-- ADIM 9: Form Yapısı (novalidate ve span hata alanları) -->
        <form id="etkinlik-formu" novalidate>

            <div class="form-group">
                <label for="ad">Etkinlik adı</label>
                <input type="text" id="ad" name="ad">
                <span id="ad-hata" class="error-text"></span>
            </div>

            <div class="form-group">
                <label for="kategori">Kategori</label>
                <select id="kategori" name="kategori">
                    <option value="" disabled selected>Seçiniz</option>
                    <option value="Seminer">Seminer</option>
                    <option value="Atölye">Atölye</option>
                    <option value="Konferans">Konferans</option>
                    <option value="Söyleşi">Söyleşi</option>
                </select>
                <span id="kategori-hata" class="error-text"></span>
            </div>

            <div class="form-group">
                <label for="tarih">Tarih</label>
                <input type="date" id="tarih" name="tarih">
                <span id="tarih-hata" class="error-text"></span>
            </div>

            <div class="form-group">
                <label for="saat">Saat</label>
                <input type="time" id="saat" name="saat">
                <span id="saat-hata" class="error-text"></span>
            </div>

            <div class="form-group">
                <label for="yer">Yer</label>
                <input type="text" id="yer" name="yer">
                <span id="yer-hata" class="error-text"></span>
            </div>

            <div class="form-group">
                <label for="kontenjan">Kontenjan</label>
                <input type="number" id="kontenjan" name="kontenjan">
                <span id="kontenjan-hata" class="error-text"></span>
            </div>

            <div class="form-group">
                <label for="aciklama">Açıklama</label>
                <textarea id="aciklama" name="aciklama" rows="4"></textarea>
                <span id="aciklama-hata" class="error-text"></span>
            </div>

            <button type="submit" class="btn-submit">Kaydet</button>

            <!-- ADIM 9.3: Form altındaki boş bildirim kutusu -->
            <div id="form-mesaj" style="display: none; margin-top: 15px;"></div>

        </form>
    </main>

    <footer>
        <p>Ad Soyad: Yağmur Lök | Okul No: 2416501035 | 2026</p>
    </footer>

</body>

</html>
